name: Validation du titre de la PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:
    name: Vérifier les Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Vérification via amannn/action-semantic-pull-request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            La description (après les deux points) ne doit pas commencer par une majuscule.
            Exemple valide : "feat: add main entry point"
            Exemple invalide : "feat: Add main entry point"

